content:
  source:
    dockerfile: release/ansible/Dockerfile.rhel8
    git:
      branch:
        # target: release-{MAJOR}.{MINOR}
        target: ansible-rework  # ART-7856
      # url: git@github.com:openshift/ocp-release-operator-sdk.git
      url: https://github.com/vfreex/ocp-release-operator-sdk.git
      web: https://github.com/openshift/ocp-release-operator-sdk
    # modifications:
    # - action: replace
    #   match: "python -m pip install --no-cache-dir . && \\"
    #   replacement: "python -m pip install --no-cache-dir $REMOTE_SOURCES_DIR/cachito-gomod-with-deps/app/release/ansible && \\"
    pkg_managers:
    - gomod
    - pip
    ci_alignment:
      streams_prs:
        ci_build_root:
          stream: rhel-8-golang-ci-build-root
cachito:
  packages:
    pip:
    - path: release/ansible
      requirements_build_files:
        - requirements-build.txt
enabled_repos:
- rhel-8-baseos-rpms
- rhel-8-appstream-rpms
- rhel-8-server-ose-rpms-embargoed
- rhel-8-server-ansible-2.9-rpms
for_payload: false
from:
  builder:
  - stream: golang
  member: openshift-enterprise-base
maintainer:
  component: Operator SDK
name: openshift/ose-ansible-operator
owners:
- aos-operator-sdk@redhat.com
- jlanford@redhat.com
- fabian@redhat.com
non_shipping_repos:
- rhel-8-server-ose-rpms-embargoed
