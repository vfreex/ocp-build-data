content:
  set_build_variables: false
  source:
    path: images
    dockerfile: openshift-golang-builder.Dockerfile
    git:
      branch:
        target: rhel-9-golang-1.20-go-wrapper
      url: git@github.com:vfreex/ocp-build-data.git
enabled_repos:
  - rhel-9-server-ose-build-rpms
  - rhel-9-baseos-rpms
  - rhel-9-golang-rpms
  # for clang
  - rhel-9-appstream-rpms
from:
  stream: rhel9
labels:
  io.k8s.description: golang builder image for Red Hat internal builds
name: openshift/golang-builder
owners:
  - aos-team-art@redhat.com
maintainer:
  component: Release
image_build_method: osbs2
